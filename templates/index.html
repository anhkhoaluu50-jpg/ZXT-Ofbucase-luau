<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lua Offline Encoder VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050509;--bg2:#0d0d15;--border:rgba(255,255,255,.06);--text:#eaeaf2;--muted:#6b6b85;--cyan:#00d4ff;--purple:#a855f7;--green:#22c55e;--red:#ef4444}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.bg-fx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;animation:float 15s ease-in-out infinite}
.orb1{width:400px;height:400px;background:radial-gradient(circle,#00d4ff,transparent 70%);top:-100px;left:-100px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,#a855f7,transparent 70%);bottom:-150px;right:-150px;animation-delay:-5s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,50px)}}
.container{max-width:900px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;padding:20px 0 30px}
h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{color:var(--muted);font-size:.85rem}

.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{padding:12px 20px;border:none;border-radius:10px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;box-shadow:0 6px 20px rgba(0,212,255,.25);flex:1}
.btn-success{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;box-shadow:0 6px 20px rgba(34,197,94,.25);width:100%;margin-top:12px}
.btn-secondary{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:rgba(0,212,255,.1);border-color:var(--cyan)}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}

.file-input{position:relative;overflow:hidden;display:inline-block}
.file-input input{position:absolute;inset:0;opacity:0;cursor:pointer}

.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:768px){.editor-grid{grid-template-columns:1fr}}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.box-head{padding:14px 18px;background:rgba(0,0,0,.3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.box-head span{font-size:.8rem;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;height:350px;background:#06060b;border:none;padding:16px;color:var(--text);font-family:Consolas,monospace;font-size:13px;resize:vertical;outline:none;line-height:1.6}
textarea::placeholder{color:#3a3a4a}
.info-bar{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);padding:8px 16px;background:rgba(0,0,0,.2);border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="bg-fx"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="container">
<header>
<h1>Lua Offline Encoder VIP</h1>
<p class="sub">Mã hóa độc lập - Vĩnh viễn - Không cần Server</p>
</header>

<div class="toolbar">
<div class="file-input">
<button class="btn btn-secondary">📁 Chọn File Lua</button>
<input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFile(event)">
</div>
<button class="btn btn-danger" onclick="clearAll()">🧹 Xóa Tất Cả</button>
</div>

<div class="editor-grid">
<div class="box">
<div class="box-head"><span>📥 Code Gốc (Lua)</span></div>
<textarea id="inputCode" placeholder="Dán code Lua gốc vào đây hoặc chọn file..." spellcheck="false" oninput="updateInfo()"></textarea>
<div class="info-bar"><span>Ký tự: <b id="inSize">0</b></span></div>
</div>
<div class="box">
<div class="box-head"><span>📤 Loadstring Độc Lập</span></div>
<textarea id="outputCode" placeholder="Loadstring sẽ xuất hiện ở đây..." readonly spellcheck="false"></textarea>
<div class="info-bar"><span>Kích thước: <b id="outSize">0</b></span></div>
</div>
</div>

<button class="btn btn-primary" id="btnEncode" onclick="encode()">⚡ Mã Hóa Thành Loadstring</button>
<button class="btn btn-success" id="btnCopy" onclick="copyOutput()" style="display:none">📋 Copy Loadstring</button>

</div>

<script>
function updateInfo(){
    document.getElementById("inSize").innerText = document.getElementById("inputCode").value.length;
}
function loadFile(e){
    var f = e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){
        document.getElementById("inputCode").value = ev.target.result;
        updateInfo();
    };
    r.readAsText(f);
}
function clearAll(){
    document.getElementById("inputCode").value = "";
    document.getElementById("outputCode").value = "";
    document.getElementById("outSize").innerText = "0";
    document.getElementById("btnCopy").style.display = "none";
    updateInfo();
}
async function encode(){
    var code = document.getElementById("inputCode").value.trim();
    if(!code){ alert("Vui lòng nhập code Lua!"); return; }
    
    var btn = document.getElementById("btnEncode");
    btn.innerText = "Đang mã hóa...";
    btn.disabled = true;
    
    try {
        var res = await fetch("/api/encode", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({code: code})
        });
        var data = await res.json();
        
        if(data.ok){
            document.getElementById("outputCode").value = data.standalone_code;
            document.getElementById("outSize").innerText = data.final_size;
            document.getElementById("btnCopy").style.display = "block";
        } else {
            alert("Lỗi: " + data.error);
        }
    } catch(e) {
        alert("Lỗi kết nối: " + e.message);
    } finally {
        btn.innerText = "⚡ Mã Hóa Thành Loadstring";
        btn.disabled = false;
    }
}
function copyOutput(){
    var out = document.getElementById("outputCode").value;
    if(!out) return;
    navigator.clipboard.writeText(out).then(function(){
        var btn = document.getElementById("btnCopy");
        btn.innerText = "✅ Đã Copy! Dán vào Delta X ngay";
        setTimeout(function(){ btn.innerText = "📋 Copy Loadstring"; }, 3000);
    });
}
</script>
</body>
</html>
