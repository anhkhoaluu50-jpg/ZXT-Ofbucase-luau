<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Encoder VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050509;--bg2:#0d0d15;--border:rgba(255,255,255,.06);--text:#eaeaf2;--muted:#6b6b85;--cyan:#00d4ff;--purple:#a855f7;--green:#22c55e}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
header{text-align:center;padding:20px 0 30px}
h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{color:var(--muted);font-size:.85rem}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{padding:12px 20px;border:none;border-radius:10px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;flex:1}
.btn-success{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;width:100%;margin-top:12px}
.btn-secondary{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.file-input{position:relative;overflow:hidden;display:inline-block}
.file-input input{position:absolute;inset:0;opacity:0;cursor:pointer}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:768px){.editor-grid{grid-template-columns:1fr}}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.box-head{padding:14px 18px;background:rgba(0,0,0,.3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.box-head span{font-size:.8rem;font-weight:700;color:var(--cyan);text-transform:uppercase}
textarea{width:100%;height:300px;background:#06060b;border:none;padding:16px;color:var(--text);font-family:Consolas,monospace;font-size:13px;resize:vertical;outline:none;line-height:1.6}
.result-box{background:var(--bg2);border:1px solid var(--green);border-radius:16px;padding:20px;margin-top:16px;display:none}
.result-box h3{color:var(--cyan);font-size:.85rem;margin-bottom:8px;text-transform:uppercase}
.link-box{background:#06060b;padding:16px;border-radius:10px;color:#4ade80;font-family:monospace;word-break:break-all;margin-bottom:12px;border-left:3px solid var(--green);font-size:13px;max-height:150px;overflow-y:auto;}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Lua Encoder VIP</h1>
<p class="sub">Mã hóa - Tạo Link Raw - Bảo vệ code</p>
</header>

<div class="toolbar">
<div class="file-input">
<button class="btn btn-secondary">📁 Chọn File</button>
<input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFile(event)">
</div>
<button class="btn btn-danger" onclick="clearAll()">🧹 Xóa Hết</button>
</div>

<div class="editor-grid">
<div class="box">
<div class="box-head"><span>📥 Code Gốc (Lua)</span></div>
<textarea id="inputCode" placeholder="Dán code vào đây..."></textarea>
</div>
<div class="box">
<div class="box-head"><span>📤 Link Raw</span></div>
<textarea id="outputCode" readonly placeholder="Link raw sẽ hiện ở đây..."></textarea>
</div>
</div>

<button class="btn btn-primary" id="btnEncode" onclick="encode()">⚡ Tạo Mã</button>

<div class="result-box" id="resultBox">
<h3>🔗 Link Raw (Dùng để chia sẻ, bị chặn xem code)</h3>
<div class="link-box" id="rawUrl"></div>
<button class="btn btn-secondary" onclick="copyUrl()">📋 Copy Link Raw</button>

<h3 style="margin-top:20px">⚡ Loadstring Độc Lập (Dán vào Delta X là chạy luôn)</h3>
<div class="link-box" id="loadstringUrl" style="color:#c084fc; border-left-color:var(--purple)"></div>
<button class="btn btn-success" onclick="copyLoadstring()">📋 Copy Loadstring</button>
</div>

</div>

<script>
function loadFile(e){
    var f = e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){ document.getElementById("inputCode").value = ev.target.result; };
    r.readAsText(f);
}
function clearAll(){
    document.getElementById("inputCode").value = "";
    document.getElementById("outputCode").value = "";
    document.getElementById("resultBox").style.display = "none";
}
async function encode(){
    var code = document.getElementById("inputCode").value.trim();
    if(!code){ alert("Vui lòng nhập code Lua!"); return; }
    
    var btn = document.getElementById("btnEncode");
    btn.innerText = "Đang mã hóa...";
    btn.disabled = true;
    
    try {
        var res = await fetch("/api/encode", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({code: code})
        });
        var data = await res.json();
        
        if(data.ok){
            document.getElementById("outputCode").value = data.raw_url;
            document.getElementById("rawUrl").innerText = data.raw_url;
            document.getElementById("loadstringUrl").innerText = data.loadstring_url;
            document.getElementById("resultBox").style.display = "block";
        } else {
            alert("Lỗi: " + data.error);
        }
    } catch(e) {
        alert("Lỗi kết nối!");
    } finally {
        btn.innerText = "⚡ Tạo Mã";
        btn.disabled = false;
    }
}
function copyUrl(){
    navigator.clipboard.writeText(document.getElementById("rawUrl").innerText).then(function(){
        alert("Đã copy Link Raw!");
    });
}
function copyLoadstring(){
    navigator.clipboard.writeText(document.getElementById("loadstringUrl").innerText).then(function(){
        alert("Đã copy Loadstring! Dán vào Delta X ngay.");
    });
}
</script>
</body>
</html>
